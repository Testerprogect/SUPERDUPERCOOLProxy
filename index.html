<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Client-Side Proxy</title>
</head>
<body>
    <div id="proxy-container">Loading website...</div>

    <script>
        // Public CORS proxy to bypass browser security blocks
        const corsProxy = "https://herokuapp.com"; 
        const targetUrl = "https://example.com"; // Replace with the site you want to load

        async function loadProxiedPage() {
            try {
                // Fetch the site through a CORS proxy
                const response = await fetch(corsProxy + targetUrl);
                const htmlContent = await response.text();

                // Clear the default loading text
                document.body.innerHTML = ""; 

                // FIX: Inject the content directly into the document so the browser renders it
                document.write(htmlContent);
                document.close(); 
            } catch (error) {
                document.getElementById("proxy-container").innerText = "Error loading page: " + error.message;
            }
        }

        loadProxiedPage();
    </script>
</body>
</html>
