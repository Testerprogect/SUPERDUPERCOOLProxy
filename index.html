<!DOCTYPE html>
<html>
<head>
    <title>Proxy</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        input { padding: 10px; width: 300px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; padding: 20px; border: 1px solid #ccc; min-height: 200px; text-align: left; overflow-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Web Proxy</h1>
    <input type="text" id="url" placeholder="Enter URL (https://example.com)" value="https://example.com">
    <button onclick="fetchUrl()">Fetch</button>
    <div id="result"></div>

    <script>
        async function fetchUrl() {
            const url = document.getElementById('url').value;
            const result = document.getElementById('result');
            
            if (!url) {
                result.textContent = 'Please enter a URL';
                return;
            }

            result.textContent = 'Loading...';
            
            try {
                const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url));
                const data = await response.json();
                result.innerHTML = '<pre>' + escapeHtml(data.contents) + '</pre>';
            } catch (error) {
                result.textContent = 'Error: ' + error.message;
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
